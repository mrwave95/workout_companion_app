<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Racked</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#121316;
    --surface:#1c1e22;
    --surface-raised:#24272c;
    --border:#2c2f34;
    --text:#EDEBE6;
    --text-muted:#8b8f97;
    --red:#E2472B;
    --red-dim:#5a2419;
    --green:#7A9B76;
    --green-dim:#2c3a2a;
    --blue:#5B7B93;
    --radius:16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none; user-select:none;
  }
  input, textarea{ user-select:text; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #topbar{
    padding: calc(14px + var(--safe-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--border); flex-shrink:0; min-height:24px;
  }
  #topbar h1{ font-size:15px; margin:0; letter-spacing:.08em; text-transform:uppercase; font-weight:800; }
  /* Home screen: topbar moves to the bottom, title shrinks/mutes and moves to the right */
  #app.bar-bottom #topbar{
    order:2; border-bottom:none; border-top:1px solid var(--border);
    padding: 12px 18px calc(12px + var(--safe-bottom));
  }
  #app.bar-bottom #viewport{ order:1; padding-top: calc(14px + var(--safe-top)); }
  #app.bar-bottom #topbarTitle{
    order:2; display:flex; align-items:baseline; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted);
  }
  #app.bar-bottom #topbarActions{ order:1; }
  .version-tag{ font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--text-muted); opacity:.7; text-transform:none; }
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text); border-radius:10px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{ background:var(--surface-raised); }
  .text-btn{
    background:none; border:none; color:var(--text-muted); font-size:13px; font-weight:600;
    letter-spacing:.03em; cursor:pointer; padding:8px; text-transform:uppercase;
  }
  .text-btn.accent{ color:var(--red); }
  .text-btn.positive{ color:var(--green); }
  #viewport{ flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom: calc(24px + var(--safe-bottom)); -webkit-overflow-scrolling:touch; }
  .view{ display:none; padding: 18px 18px 8px; animation: fade .18s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Typography helpers ---------- */
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin:0 0 6px; }
  .h2{ font-size:22px; font-weight:800; letter-spacing:.01em; margin:0 0 4px; }
  .muted{ color:var(--text-muted); font-size:13px; }
  .mono{ font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace; }

  /* ---------- Home ---------- */
  .home-title{ font-size:30px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; margin:6px 0 2px; }
  .home-sub{ color:var(--text-muted); font-size:13px; margin:0 0 26px; }
  .tile{
    display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px; margin-bottom:12px; color:var(--text); cursor:pointer;
    position:relative; overflow:hidden; font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .tile:active{ background:var(--surface-raised); }
  .tile .t-label{ font-size:17px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; }
  .tile .t-sub{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .tile .t-bar{ position:absolute; left:0; top:0; bottom:0; width:5px; }
  .tile.c-red .t-bar{ background:var(--red); }
  .tile.c-green .t-bar{ background:var(--green); }
  .tile.c-blue .t-bar{ background:var(--blue); }
  .tile.c-muted .t-bar{ background:var(--text-muted); }

  /* ---------- Buttons (generic) ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:12px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:14px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
    padding:14px 18px; cursor:pointer; width:100%;
  }
  .btn:active{ background:var(--surface-raised); }
  .btn.primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn.positive{ background:var(--green); border-color:var(--green); color:#12140f; }
  .btn.ghost{ background:transparent; }
  .btn.small{ width:auto; padding:9px 14px; font-size:12px; }
  .btn[disabled]{ opacity:.4; }
  .row-btns{ display:flex; gap:10px; }
  .row-btns .btn{ flex:1; }

  /* ---------- Lists ---------- */
  .list-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:10px; cursor:pointer;
  }
  .list-item:active{ background:var(--surface-raised); }
  .list-item .li-main{ font-size:15px; font-weight:700; }
  .list-item .li-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .workout-start{ flex:1; min-width:0; background:none; border:none; padding:0; color:inherit; text-align:left; font:inherit; cursor:pointer; }
  .workout-start span{ display:block; }
  .li-del{ background:none; border:none; color:var(--text-muted); font-size:18px; padding:6px 4px; cursor:pointer; flex-shrink:0; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .ee{ font-size:34px; margin-bottom:10px; }
  .empty-state .el{ font-weight:700; color:var(--text); margin-bottom:4px; }

  .exercise-library{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .exercise-library-card{ min-width:0; margin:0; padding:16px; overflow-wrap:anywhere; }
  .exercise-library-card .t-label{ font-size:15px; }
  .history-notice{ line-height:1.5; margin:0 0 16px; }

  /* ---------- Form fields ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:7px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:13px 14px; color:var(--text); font-size:15px; font-family:inherit;
  }
  .field textarea{ min-height:64px; resize:vertical; font-family:inherit; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--blue); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- Carousel ---------- */
  .carousel-wrap{ padding-top:6px; }
  .carousel-viewport{
    position:relative; overflow:hidden; border-radius:var(--radius);
    box-shadow: 8px 8px 0 -3px var(--surface-raised), 16px 15px 0 -6px var(--border);
    margin-bottom: 22px;
  }
  .carousel-track{ display:flex; touch-action: pan-y; }
  .card-slide{ flex:0 0 auto; }
  .dots{ display:flex; justify-content:center; gap:6px; margin-bottom:18px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--border); }
  .dot.active{ background:var(--red); width:16px; border-radius:4px; }
  .carousel-nav{ display:flex; justify-content:space-between; margin-top:-10px; margin-bottom:14px; }
  .nav-arrow{ background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; }
  .nav-arrow:active{ background:var(--surface-raised); }
  .nav-arrow[disabled]{ opacity:.3; }

  /* ---------- Exercise card ---------- */
  .ex-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; min-height:340px; }
  .ex-card.finished{ opacity:.5; }
  .ex-card .ex-name{ font-size:19px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; margin:0 0 14px; }
  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin: 8px 0 18px; }
  .stepper-row .sbtn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--surface-raised);
    color:var(--text); font-size:20px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .stepper-row .sbtn:active{ background:var(--border); }
  .stepper-row .sval{
    flex:1; max-width:130px; text-align:center; background:transparent; border:none; color:var(--text);
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace; font-size:34px; font-weight:700;
  }
  .stepper-label{ text-align:center; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); font-weight:700; }
  .progress-hint{ font-size:12.5px; color:var(--blue); margin-top:-8px; margin-bottom:14px; line-height:1.4; }
  .set-log{ margin-top:6px; margin-bottom:14px; }
  .set-log-title{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:8px; }
  .set-chip{ display:inline-block; background:var(--surface-raised); border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-size:13px; font-family: ui-monospace, monospace; margin:0 6px 6px 0; color:var(--text); cursor:pointer; -webkit-appearance:none; appearance:none; }
  .set-chip:active{ background:var(--border); }

  /* ---------- Progression ---------- */
  .seg{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:18px; }
  .seg button{ flex:1; border:none; background:none; color:var(--text-muted); padding:10px; border-radius:9px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; }
  .seg button.active{ background:var(--red); color:#fff; }
  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; min-height:300px; }
  .chart-card .cc-title{ font-size:18px; font-weight:800; text-transform:uppercase; margin:0; }
  .chart-card .cc-sub{ font-size:12px; color:var(--text-muted); margin:2px 0 14px; }
  canvas.chart{ width:100%; height:180px; display:block; }
  .entry-list{ margin-top:4px; }
  .entry-row{
    display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:8px;
    color:var(--text); font-family:inherit; font-size:14px; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .entry-row:active{ background:var(--surface-raised); }
  .entry-row .er-date{ color:var(--text-muted); font-size:13px; }
  .entry-row .er-val{ font-family:ui-monospace,"SF Mono","Roboto Mono",monospace; font-weight:700; }
  .stat-row{ display:flex; gap:20px; margin-top:14px; }
  .stat{ flex:1; }
  .stat .sv{ font-family: ui-monospace, monospace; font-size:20px; font-weight:700; }
  .stat .sl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }

  /* ---------- Create workout deck items ---------- */
  .deck-item{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .deck-item .deck-info{ flex:1; min-width:0; }
  .deck-item .di-name{ font-weight:700; font-size:14px; }
  .deck-item .di-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; font-family:ui-monospace,monospace; }
  .deck-move{ display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0; width:26px; }
  .deck-move-btn{ background:none; border:none; color:var(--text-muted); font-size:11px; padding:4px; cursor:pointer; line-height:1; font-family:inherit; -webkit-appearance:none; appearance:none; }
  .deck-move-btn:active{ color:var(--text); }
  .deck-move-btn[disabled]{ opacity:.25; cursor:default; }
  .deck-num{ font-size:10.5px; color:var(--text-muted); font-family:ui-monospace,monospace; }
  .inline-form{ background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
  .suggest-list{ margin-top:8px; border-radius:10px; overflow:hidden; }
  .suggest-list:empty{ margin:0; }
  .suggest-item{
    display:block; width:100%; text-align:left; background:var(--surface-raised); border:none; border-bottom:1px solid var(--border);
    padding:11px 14px; color:var(--text); font-size:14px; font-family:inherit; cursor:pointer;
  }
  .suggest-item:first-child{ border-top:1px solid var(--border); border-top-left-radius:10px; border-top-right-radius:10px; }
  .suggest-item:last-child{ border-bottom:1px solid var(--border); border-bottom-left-radius:10px; border-bottom-right-radius:10px; }
  .suggest-item:active{ background:var(--border); }

  /* ---------- Toast ---------- */
  #toast{ position:fixed; left:50%; bottom: calc(24px + var(--safe-bottom)); transform:translate(-50%, 20px); background:var(--surface-raised); border:1px solid var(--border); color:var(--text); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; z-index:50; max-width:85vw; text-align:center; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:80; }
  .modal-overlay.show{ display:flex; }
  .modal-card{ background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:20px 20px 0 0; padding:22px 20px calc(22px + var(--safe-bottom)); width:100%; max-width:480px; max-height:100vh; max-height:100dvh; overflow-y:auto; animation: slideUp .18s ease; }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  a{ color:var(--blue); }
  hr{ border:none; border-top:1px solid var(--border); margin:22px 0; }
  .storage-notice{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.7); }
  .storage-notice[hidden]{ display:none; }
  .storage-notice-card{ width:100%; max-width:440px; padding:22px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .storage-notice-card p{ margin:0 0 18px; line-height:1.5; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<div id="app" inert>
  <header id="topbar"><h1 id="topbarTitle">Racked</h1><div id="topbarActions"></div></header>
  <main id="viewport">
    <section id="view-home" class="view"></section>
    <section id="view-exercises" class="view"></section>
    <section id="view-workouts" class="view"></section>
    <section id="view-session" class="view"></section>
    <section id="view-create" class="view"></section>
    <section id="view-measure" class="view"></section>
    <section id="view-progress" class="view"></section>
    <section id="view-backup" class="view"></section>
  </main>
</div>
<aside id="storageNotice" class="storage-notice" role="status" aria-live="polite">
  <div class="storage-notice-card">
    <p id="storageMessage">Opening your saved data…</p>
    <button type="button" class="btn ghost" id="storageExport">Export This Tab's Data</button>
    <button type="button" class="btn ghost" id="storageReload" style="margin-top:10px;">Reload Latest Data</button>
  </div>
</aside>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   STORAGE
   ========================================================= */
const STORAGE_KEY = 'racked_state_v1';
const APP_VERSION = '1.6.0';

function defaultState(){
  return { version:1, workouts:[], sessions:[], measurements:[], activeSession:null };
}
// Keep the last durable snapshot so failed writes cannot masquerade as saved changes.
let persistedStateJSON = JSON.stringify(defaultState());
let storageRecoveryRaw = null;
let storageReadFailed = false;
let observedStorageRaw = null;
let hasWriteLock = false;
let storageConflict = false;
let conflictStateJSON = null;
function loadState(){
  // Re-run only before granting edit access, never while a form is editable.
  persistedStateJSON = JSON.stringify(defaultState());
  storageRecoveryRaw = null;
  storageReadFailed = false;
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
    observedStorageRaw = raw;
    if(raw===null) return defaultState();
    const loaded = normalizeState(JSON.parse(raw));
    persistedStateJSON = JSON.stringify(loaded);
    return loaded;
  }catch(e){
    console.error('load failed', e);
    storageRecoveryRaw = raw;
    storageReadFailed = raw===null;
    alert('Saved data could not be loaded. It has not been changed. Export a Full Backup to recover the original data, or restore a valid full backup before making changes.');
    return defaultState();
  }
}
let state = loadState();
function saveState({allowRecovery=false}={}){
  if(!hasWriteLock || storageConflict){
    state = JSON.parse(persistedStateJSON);
    alert('This tab cannot save. Use the editing tab, or reload after it closes. This change was not kept.');
    return false;
  }
  if((storageRecoveryRaw!==null || storageReadFailed) && !allowRecovery){
    state = JSON.parse(persistedStateJSON);
    alert('Changes were not saved because the original data needs recovery. Export a Full Backup, then restore a valid full backup.');
    return false;
  }
  try{
    // The lock serializes updated tabs. Detect older clients or storage clears
    // as well; a check alone would not be an atomic cross-tab lock.
    if(localStorage.getItem(STORAGE_KEY)!==observedStorageRaw){
      stopStaleEditor();
      return false;
    }
    const json = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, json);
    persistedStateJSON = json;
    observedStorageRaw = json;
    storageRecoveryRaw = null;
    storageReadFailed = false;
    return true;
  }catch(e){
    state = JSON.parse(persistedStateJSON);
    console.error('save failed', e);
    alert('Could not save — your device storage may be full or restricted. This change was not kept. Your previously saved data is unchanged.');
    return false;
  }
}

/* =========================================================
   UTILS
   ========================================================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISODate(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
// Date-only measurements are calendar dates, not UTC timestamps.
function parseDate(value){
  if(typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value)){
    return new Date(value+'T00:00:00');
  }
  return new Date(value);
}
function fmtDateShort(iso){
  const d = parseDate(iso);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function fmtDateFull(iso){
  const d = parseDate(iso);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function readNonnegativeInput(input, integer=false){
  const value = Number(input.value);
  return input.value.trim()!=='' && Number.isFinite(value) && value>=0 && (!integer || Number.isInteger(value)) ? value : null;
}
function readWeightInput(input){
  const raw = input.value.trim();
  // Accept either decimal separator, but never partial numbers or mixed separators.
  if(!/^\+?(?:\d+(?:[.,]\d*)?|[.,]\d+)(?:e[+-]?\d+)?$/i.test(raw)) return null;
  const value = Number(raw.replace(',', '.'));
  return Number.isFinite(value) && value>=0 ? value : null;
}
function clampNum(n, min, max){ return Math.min(max, Math.max(min, n)); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let modalReturnFocus = null;
function showModal(html){
  modalReturnFocus = document.activeElement;
  const card = document.getElementById('modalCard');
  card.innerHTML = html;
  const heading = card.querySelector('.eyebrow');
  if(heading){ heading.id = 'modalTitle'; card.setAttribute('aria-labelledby', heading.id); }
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('app').inert = true;
  (card.querySelector('input, textarea, button') || card).focus();
}
function hideModal(){
  const previous = modalReturnFocus;
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('app').inert = !hasWriteLock || storageConflict;
  document.getElementById('modalCard').innerHTML = '';
  if(modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus();
  modalReturnFocus = null;
  // Save/delete can replace the opening row immediately after closing. Restore
  // its replacement after that render rather than leaving focus on the body.
  queueMicrotask(()=>{
    if(!previous || previous.isConnected) return;
    let replacement = previous.id && document.getElementById(previous.id);
    if(previous.dataset.mid){
      replacement = [...document.querySelectorAll('[data-mid]')].find(el=>el.dataset.mid===previous.dataset.mid);
    } else if(previous.dataset.exidx!=null){
      replacement = [...document.querySelectorAll('.set-chip')].find(el=>el.dataset.exidx===previous.dataset.exidx && el.dataset.setidx===previous.dataset.setidx)
        || [...document.querySelectorAll('[data-role="weight"]')].find(el=>el.dataset.idx===previous.dataset.exidx);
    }
    if(replacement) replacement.focus();
    else {
      const title = document.getElementById('topbarTitle');
      title.tabIndex = -1; title.focus();
    }
  });
}
document.getElementById('modalOverlay').addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ e.preventDefault(); hideModal(); return; }
  if(e.key!=='Tab') return;
  const controls = [...document.getElementById('modalCard').querySelectorAll('button, input, textarea, select, [tabindex]')]
    .filter(el=>!el.disabled && el.tabIndex>=0 && el.getClientRects().length);
  if(!controls.length){ e.preventDefault(); return; }
  const first = controls[0], last = controls[controls.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='modalOverlay') hideModal();
});

/* =========================================================
   ROUTER
   ========================================================= */
let currentView='home', currentParams={};
const VIEWS = ['home','exercises','workouts','session','create','measure','progress','backup'];

function navigate(view, params={}, push=true){
  currentView = view; currentParams = params||{};
  if(push) history.pushState({view,params:currentParams}, '', '#'+view);
  render();
}
window.addEventListener('popstate', (e)=>{
  const s = e.state || {view:'home', params:{}};
  currentView = s.view; currentParams = s.params||{};
  render();
});

function render(){
  if(sessionCarousel){ sessionCarousel.destroy(); sessionCarousel = null; }
  if(progCarousel){ progCarousel.destroy(); progCarousel = null; }
  VIEWS.forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('active', v===currentView);
  });
  document.getElementById('app').classList.toggle('bar-bottom', currentView==='home');
  const titleEl = document.getElementById('topbarTitle');
  const actionsEl = document.getElementById('topbarActions');
  actionsEl.innerHTML = '';

  if(currentView==='home'){
    titleEl.innerHTML = `Racked<span class="version-tag">v${esc(APP_VERSION)}</span>`;
    renderHome();
  } else {
    const back = document.createElement('button');
    back.className='icon-btn'; back.textContent='←'; back.setAttribute('aria-label','Back');
    back.onclick = ()=>history.back();
    actionsEl.appendChild(back);
  }

  if(currentView==='exercises'){ titleEl.textContent='Exercises'; renderExercisesLibrary(); }
  if(currentView==='workouts'){ titleEl.textContent='Workouts'; renderWorkoutsList(); }
  if(currentView==='session'){ titleEl.textContent = state.activeSession?.workoutName || 'Session'; renderSession(); }
  if(currentView==='create'){ titleEl.textContent = currentParams.workoutId ? 'Edit Workout' : 'Create Workout'; renderCreate(currentParams.workoutId); }
  if(currentView==='measure'){ titleEl.textContent='Measurements'; renderMeasure(); }
  if(currentView==='progress'){ titleEl.textContent='Progression'; renderProgress(); }
  if(currentView==='backup'){ titleEl.textContent='Backup & Export'; renderBackup(); }
}

function startOrResumeWorkout(workoutId){
  const w = state.workouts.find(x=>x.id===workoutId);
  if(!w) return;
  if(w.exercises.length===0){ toast('Add an exercise before starting this workout'); return; }

  if(state.activeSession && state.activeSession.kind!=='exercise' && state.activeSession.workoutId===workoutId){
    const allFinished = state.activeSession.exercises.every(e=>e.finished);
    if(!allFinished){
      navigate('session', {workoutId, workoutName:w.name});
      return;
    }
    // Every card was already finished from a previous visit that never hit
    // "Finish Workout" — archive it to history and start clean instead of
    // reopening a session where everything looks permanently used up.
    state.sessions.push(JSON.parse(JSON.stringify(state.activeSession)));
    state.activeSession = null;
    if(!saveState()) return;
    toast('Previous session saved — starting fresh');
  } else if(state.activeSession){
    if(!confirm(`You have an unfinished session for "${state.activeSession.workoutName}". Discard it and start "${w.name}"?`)) return;
  }

  state.activeSession = {
    id: uid(), workoutId: w.id, workoutName: w.name, date: new Date().toISOString(),
    exercises: w.exercises.map(ex=>({
      exerciseId: ex.id, catalogId: exerciseCatalogId(ex), name: ex.name, notes:'', weight: ex.weight, reps: ex.reps,
      startWeight: ex.weight, startReps: ex.reps,
      sets: [], finished:false
    }))
  };
  if(!saveState()) return;
  navigate('session', {workoutId, workoutName:w.name});
}

function renderSession(startIndex){
  if(sessionCarousel){ sessionCarousel.destroy(); sessionCarousel = null; }

  const byRecency = [...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let slides = sess.exercises.map((ex, i)=>renderExerciseCardHTML(ex, i, byRecency)).join('');

// Uses est1RM's "best set" logic (same as the progression chart) to find the
// top set of each of the last two sessions for this exercise identity. If the
// rep count matches both times, that's a plateau worth a gentle nudge.
function getRepProgressionHint(exercise, byRecency){
  const key = exerciseCatalogId(exercise);
  const bySession = [];
  for(const sess of byRecency){
    for(const ex of sess.exercises){
      if(exerciseCatalogId(ex)===key && ex.sets.length>0){
        const best = ex.sets.reduce((m,s)=>{
          const e1 = est1RM(s.weight, s.reps);
          return e1>m.e ? {e:e1, weight:s.weight, reps:s.reps} : m;
        }, {e:-1, weight:0, reps:0});
        bySession.push(best);
        break; // one entry per session
      }
    }
    if(bySession.length>=2) break;
  }
  if(bySession.length<2) return null;
  const [latest, prev] = bySession;
  if(latest.reps>0 && latest.reps===prev.reps){
    return `Same rep count (${latest.reps}) the last 2 times — maybe push for one more today.`;
  }
  return null;
}

function renderExerciseCardHTML(ex, idx, byRecency){
  const draft = state.activeSession.kind==='exercise' ? ex.draftInputs : null;
  const setsHtml = ex.sets.map((s,si)=>`<button type="button" class="set-chip" data-exidx="${idx}" data-setidx="${si}">${s.weight}×${s.reps}</button>`).join('');
  const previous = getLastSetForExercise(exerciseCatalogId(ex));
  const lastTime = (ex.startWeight!=null) ? `<div class="muted" style="margin-top:-8px; margin-bottom:14px;">${previous ? 'Last time' : 'Starting values'}: ${previous?.weight ?? ex.startWeight}kg × ${previous?.reps ?? ex.startReps}</div>` : '';
  const repHint = getRepProgressionHint(ex, byRecency);
  const repHintHtml = repHint ? `<div class="progress-hint">↗ ${esc(repHint)}</div>` : '';
  return `
  <div class="card-slide">
    <div class="ex-card ${ex.finished?'finished':''}" data-idx="${idx}">
      <div class="ex-name">${esc(ex.name)}</div>
      ${lastTime}
      ${repHintHtml}
      <div class="field" style="margin-bottom:14px;">
        <textarea data-role="notes" data-idx="${idx}" aria-label="Notes for ${esc(ex.name)}" placeholder="Notes (form cues, how it felt...)" ${ex.finished?'disabled':''}>${esc(ex.notes)}</textarea>
      </div>
      <div class="stepper-label">Weight (kg)</div>
      <div class="stepper-row">
        <button class="sbtn" data-act="wdown" data-idx="${idx}" aria-label="Decrease weight" ${ex.finished?'disabled':''}>−</button>
        <input class="sval mono" type="text" inputmode="decimal" aria-label="Weight (kg)" data-role="weight" data-idx="${idx}" value="${esc(draft?.weight ?? ex.weight)}" ${ex.finished?'disabled':''}>
        <button class="sbtn" data-act="wup" data-idx="${idx}" aria-label="Increase weight" ${ex.finished?'disabled':''}>+</button>
      </div>
      <div class="stepper-label">Reps</div>
      <div class="stepper-row">
        <button class="sbtn" data-act="rdown" data-idx="${idx}" aria-label="Decrease reps" ${ex.finished?'disabled':''}>−</button>
        <input class="sval mono" type="number" inputmode="numeric" step="1" aria-label="Reps" data-role="reps" data-idx="${idx}" value="${esc(draft?.reps ?? ex.reps)}" ${ex.finished?'disabled':''}>
        <button class="sbtn" data-act="rup" data-idx="${idx}" aria-label="Increase reps" ${ex.finished?'disabled':''}>+</button>
      </div>
      <div class="set-log">
        <div class="set-log-title">Logged sets ${ex.sets.length ? '<span class="muted" style="font-weight:400; text-transform:none; letter-spacing:0;">(tap to edit)</span>' : ''}</div>
        <div>${setsHtml || '<span class="muted">None yet</span>'}</div>
      </div>
      <div class="row-btns">
        <button class="btn primary" data-act="logset" data-idx="${idx}" ${ex.finished?'disabled':''}>Log Set</button>
        <button class="btn positive" data-act="finishex" data-idx="${idx}" ${ex.finished?'disabled':''}>Finish</button>
      </div>
    </div>
    ${ex.finished ? `<button class="btn ghost" data-act="reopenex" data-idx="${idx}" style="margin-top:10px;">↺ Reopen Exercise</button>` : ''}
  </div>`;
}

function wireExerciseCards(){
  const root = document.getElementById('view-session');
  root.querySelectorAll('[data-role=notes]').forEach(t=>{
    t.addEventListener('input', ()=>{
      state.activeSession.exercises[+t.dataset.idx].notes = t.value;
      if(!saveState()) t.value = state.activeSession.exercises[+t.dataset.idx].notes;
    });
  });
  root.querySelectorAll('[data-role=weight]').forEach(inp=>{
    persistIndividualInput(inp, 'weight');
    inp.addEventListener('change', ()=>{
      const ex = state.activeSession.exercises[+inp.dataset.idx];
      const v = readWeightInput(inp);
      if(v===null){ if(state.activeSession.kind!=='exercise') inp.value=ex.weight; toast('Enter a non-negative weight'); return; }
      if(state.activeSession.kind==='exercise') return; // input already persisted the draft and value
      ex.weight = v;
      if(!saveState()) inp.value = state.activeSession.exercises[+inp.dataset.idx].weight;
    });
  });
  root.querySelectorAll('[data-role=reps]').forEach(inp=>{
    persistIndividualInput(inp, 'reps');
    inp.addEventListener('change', ()=>{
      const ex = state.activeSession.exercises[+inp.dataset.idx];
      const v = readNonnegativeInput(inp, true);
      if(v===null){ if(state.activeSession.kind!=='exercise') inp.value=ex.reps; toast('Enter a whole, non-negative rep count'); return; }
      if(state.activeSession.kind==='exercise') return;
      ex.reps = v;
      if(!saveState()) inp.value = state.activeSession.exercises[+inp.dataset.idx].reps;
    });
  });
  root.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>onExerciseAction(btn.dataset.act, +btn.dataset.idx));
  });
  root.querySelectorAll('.set-chip').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditSetModal(+btn.dataset.exidx, +btn.dataset.setidx));
  });
}

function persistIndividualInput(input, role){
  if(state.activeSession.kind!=='exercise') return;
  input.addEventListener('input', ()=>{
    const ex = state.activeSession.exercises[+input.dataset.idx];
    ex.draftInputs = {...ex.draftInputs, [role]:input.value};
    const value = role==='weight' ? readWeightInput(input) : readNonnegativeInput(input, true);
    if(value!==null) ex[role] = value;
    if(!saveState()){
      const saved = state.activeSession.exercises[+input.dataset.idx];
      input.value = saved.draftInputs?.[role] ?? saved[role];
    }
  });
}

// If the exercise has already been finished, keep the workout's stored
// "last weight/reps" default in sync with whatever the last set now is,
// so an edit or delete after finishing isn't silently overridden next time.
function syncWorkoutDefaultsIfFinished(exIdx){
  const ex = state.activeSession.exercises[exIdx];
  if(!ex.finished || state.activeSession.kind==='exercise') return;
  const last = ex.sets[ex.sets.length-1] || {weight:ex.startWeight, reps:ex.startReps};
  const w = state.workouts.find(w=>w.id===state.activeSession.workoutId);
  if(w){
    const wex = w.exercises.find(e=>e.id===ex.exerciseId);
    if(wex){ wex.weight = last.weight; wex.reps = last.reps; }
  }
}

function openEditSetModal(exIdx, setIdx){
  const pending = state.activeSession.kind==='exercise' ? state.activeSession.editSetDraft : null;
  if(pending){ exIdx = pending.exerciseIndex; setIdx = pending.setIndex; }
  const ex = state.activeSession.exercises[exIdx];
  const s = ex.sets[setIdx];
  if(!s) return;
  showModal(`
    <div class="eyebrow">Edit Set</div>
    <div class="h2" style="margin-bottom:16px;">${esc(ex.name)}</div>
    <div class="grid2">
      <div class="field">
        <label for="modal-set-weight">Weight (kg)</label>
        <input type="text" inputmode="decimal" id="modal-set-weight" value="${esc(pending?.weight ?? s.weight)}">
      </div>
      <div class="field">
        <label for="modal-set-reps">Reps</label>
        <input type="number" step="1" inputmode="numeric" id="modal-set-reps" value="${esc(pending?.reps ?? s.reps)}">
      </div>
    </div>
    <button class="btn primary" id="modal-set-save">Save Changes</button>
    <button class="btn ghost" id="modal-set-delete" style="margin-top:10px; color:var(--red);">Delete Set</button>
    <button class="btn ghost" id="modal-set-cancel" style="margin-top:10px;">Cancel</button>
  `);
  if(state.activeSession.kind==='exercise'){
    for(const role of ['weight','reps']){
      document.getElementById('modal-set-'+role).addEventListener('input', ()=>{
        state.activeSession.editSetDraft = {exerciseIndex:exIdx, setIndex:setIdx,
          weight:document.getElementById('modal-set-weight').value,
          reps:document.getElementById('modal-set-reps').value};
        if(!saveState()){
          const saved = state.activeSession.editSetDraft;
          const set = state.activeSession.exercises[exIdx].sets[setIdx];
          document.getElementById('modal-set-weight').value = saved?.weight ?? set.weight;
          document.getElementById('modal-set-reps').value = saved?.reps ?? set.reps;
        }
      });
    }
  }
  document.getElementById('modal-set-save').onclick = ()=>{
    // A failed write restores a snapshot; resolve the current record on retries.
    const ex = state.activeSession.exercises[exIdx];
    const s = ex.sets[setIdx];
    const w = readWeightInput(document.getElementById('modal-set-weight'));
    const r = readNonnegativeInput(document.getElementById('modal-set-reps'), true);
    if(w===null || r===null){ toast('Enter a valid weight and reps'); return; }
    ex.sets[setIdx] = { ...s, weight:w, reps:r };
    syncWorkoutDefaultsIfFinished(exIdx);
    delete state.activeSession.editSetDraft;
    if(!saveState()) return;
    hideModal();
    renderSession(exIdx);
    toast('Set updated');
  };
  document.getElementById('modal-set-delete').onclick = ()=>{
    const ex = state.activeSession.exercises[exIdx];
    if(!confirm('Delete this set?')) return;
    ex.sets.splice(setIdx, 1);
    syncWorkoutDefaultsIfFinished(exIdx);
    delete state.activeSession.editSetDraft;
    if(!saveState()) return;
    hideModal();
    renderSession(exIdx);
    toast('Set deleted');
  };
  document.getElementById('modal-set-cancel').onclick = ()=>{
    if(state.activeSession.kind==='exercise' && state.activeSession.editSetDraft){
      delete state.activeSession.editSetDraft;
      if(!saveState()) return;
    }
    hideModal();
  };
}

function onExerciseAction(act, idx){
  const ex = state.activeSession.exercises[idx];
  if(state.activeSession.kind==='exercise' && (act==='logset' || act==='finishex')){
    if(state.activeSession.editSetDraft){
      const draft = state.activeSession.editSetDraft;
      openEditSetModal(draft.exerciseIndex, draft.setIndex);
      toast('Save or cancel your set edit first');
      return;
    }
    const weight = readWeightInput({value:String(ex.draftInputs?.weight ?? ex.weight)});
    const reps = readNonnegativeInput({value:String(ex.draftInputs?.reps ?? ex.reps)}, true);
    if(weight===null || reps===null){ toast('Enter a valid weight and whole rep count'); return; }
    ex.weight = weight; ex.reps = reps;
    if(act==='finishex'){ finishIndividualExercise(); return; }
  }
  if(act==='wup' || act==='wdown'){
    if(ex.draftInputs) delete ex.draftInputs.weight;
  }
  if(act==='rup' || act==='rdown'){
    if(ex.draftInputs) delete ex.draftInputs.reps;
  }
  if(act==='wup' || act==='wdown'){
    const next = ex.weight + (act==='wup' ? 0.5 : -0.5);
    if(!Number.isFinite(next)){ toast('Enter a finite weight'); return; }
    // Preserve ordinary one-decimal rounding without overflowing large legacy values.
    const scaled = next * 10;
    ex.weight = Number.isFinite(scaled) ? Math.round(scaled)/10 : next;
    if(act==='wdown') ex.weight = Math.max(0, ex.weight);
  }
  if(act==='rup') ex.reps = ex.reps + 1;
  if(act==='rdown') ex.reps = Math.max(0, ex.reps - 1);
  let message = '';
  if(act==='logset'){
    if(!Number.isFinite(ex.weight) || !Number.isFinite(ex.reps)){
      toast('Enter a finite weight and rep count'); return;
    }
    ex.sets.push({weight: ex.weight, reps: ex.reps, time: new Date().toISOString()});
    message = `Logged ${ex.weight} × ${ex.reps}`;
  }
  if(act==='finishex'){
    ex.finished = true;
    syncWorkoutDefaultsIfFinished(idx);
    message = `${ex.name} finished`;
  }
  if(act==='reopenex'){
    ex.finished = false;
    message = `${ex.name} reopened`;
  }
  const restoreFocus = (action)=>{
    const button = [...document.querySelectorAll('#view-session [data-act]')]
      .find(el=>el.dataset.act===action && +el.dataset.idx===idx && !el.disabled);
    if(button) button.focus();
  };
  if(!saveState()){ renderSession(idx); restoreFocus(act); return; }
  if(message) toast(message);
  renderSession(idx);
  restoreFocus(act==='finishex' ? 'reopenex' : act==='reopenex' ? 'finishex' : act);
}

function finishWorkout(){
  const sess = state.activeSession;
  if(!sess) return;
  if(sess.kind==='exercise'){ finishIndividualExercise(); return; }
  const anySets = sess.exercises.some(e=>e.sets.length>0);
  if(!anySets){
    if(!confirm('No sets logged yet. Finish workout anyway?')) return;
  }
  state.sessions.push(JSON.parse(JSON.stringify(sess)));
  state.activeSession = null;
  if(!saveState()) return;
  toast('Workout saved');
  navigate('workouts', {}, false);
  history.replaceState({view:'workouts',params:{}}, '', '#workouts');
}

/* =========================================================
   GENERIC CAROUSEL (pointer-based swipe)
   ========================================================= */
function makeCarousel(viewport, track, count, onChange, startIndex){
  let index = clampNum(startIndex||0, 0, Math.max(0,count-1)), startX=0, dx=0, dragging=false, width=0;
  viewport.setAttribute('role', 'group');
  viewport.setAttribute('aria-roledescription', 'carousel');
  viewport.setAttribute('aria-label', viewport.id==='sessCarouselViewport' ? 'Workout exercises' : 'Progress charts');

  function measure(){
    if(!viewport.clientWidth) return;
    width = viewport.clientWidth;
    Array.from(track.children).forEach(ch=>{ ch.style.width = width+'px'; });
  }
  function apply(withTransition){
    track.style.transition = withTransition ? 'transform .25s ease' : 'none';
    track.style.transform = `translateX(${-index*width}px)`;
    Array.from(track.children).forEach((slide,i)=>{
      slide.inert = i!==index;
      slide.setAttribute('aria-hidden', String(i!==index));
      slide.setAttribute('role', 'group');
      slide.setAttribute('aria-label', `${i+1} of ${count}`);
    });
    const arrows = viewport.parentElement.querySelectorAll('.nav-arrow');
    if(arrows.length===2){ arrows[0].disabled = index===0; arrows[1].disabled = index===count-1; }
  }
  measure();
  apply(false);
  const observer = new ResizeObserver(()=>{
    measure();
    apply(false);
  });
  observer.observe(viewport);

  function goTo(i){
    index = clampNum(i, 0, Math.max(0,count-1));
    apply(true);
    onChange && onChange(index);
  }
  viewport.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('button, input, textarea, select')) return; // let native controls handle their own tap
    dragging = true; startX = e.clientX; dx = 0; width = viewport.clientWidth;
    track.style.transition = 'none';
    viewport.setPointerCapture && viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    dx = e.clientX - startX;
    track.style.transform = `translateX(${-index*width + dx}px)`;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(dx < -50 && index < count-1) index++;
    else if(dx > 50 && index > 0) index--;
    dx = 0;
    apply(true);
    onChange && onChange(index);
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
  viewport.addEventListener('pointerleave', ()=>{ if(dragging) endDrag(); });

  return { next:()=>goTo(index+1), prev:()=>goTo(index-1), destroy:()=>observer.disconnect() };
}

function buildDots(containerId, count, active){
  const c = document.getElementById(containerId);
  if(!c) return;
  let html='';
  for(let i=0;i<count;i++) html += `<div class="dot ${i===active?'active':''}"></div>`;
  c.innerHTML = html;
}

/* =========================================================
   EXERCISES AND WORKOUT CREATION
   ========================================================= */
let draftDeck = [];
let keepName = '';
let editingWorkoutId = null;

// A catalog identity is separate from a template card's id/session exerciseId.
// Legacy records have no persistent identity. Preserve their existing name groups
// verbatim (including all sets), without retroactively asserting shared identity.
function exerciseCatalogId(ex){
  return ex.catalogId || 'legacy-name:'+JSON.stringify(ex.name.trim().toLowerCase());
}
function getKnownExercises(){
  const known = new Map();
  const add = (ex, source)=>{
    if(!ex.name.trim()) return;
    const id = exerciseCatalogId(ex);
    if(!known.has(id)) known.set(id, {id, name:ex.name, source});
  };
  if(state.activeSession) state.activeSession.exercises.forEach(ex=>add(ex, state.activeSession.workoutName));
  [...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date))
    .forEach(s=>s.exercises.forEach(ex=>add(ex, s.workoutName)));
  state.workouts.forEach(w=>w.exercises.forEach(ex=>add(ex, w.name)));
  return [...known.values()];
}
function hasLegacyExerciseHistory(){
  return state.sessions.some(s=>s.exercises.some(ex=>!ex.catalogId));
}
function legacyHistoryNotice(){
  return hasLegacyExerciseHistory() ? `<p class="muted history-notice">Older history is grouped by name as before. Identical names may have meant different exercises; those records have not been relinked or changed.</p>` : '';
}
function getLastSetForExercise(id){
  let last = null, lastTime = -Infinity;
  for(const sess of state.sessions){
    for(const ex of sess.exercises){
      if(exerciseCatalogId(ex)!==id) continue;
      for(const set of ex.sets){
        const time = Date.parse(set.time || sess.date);
        if(time>=lastTime){ last = set; lastTime = time; }
      }
    }
  }
  return last;
}
function getRecentDefaultsForExercise(id){
  const last = getLastSetForExercise(id);
  if(last) return {weight:last.weight, reps:last.reps};
  for(const w of state.workouts){
    const ex = w.exercises.find(ex=>exerciseCatalogId(ex)===id);
    if(ex) return {weight:ex.weight, reps:ex.reps};
  }
  return {weight:20, reps:8};
}
function exerciseSourceLabel(ex, known){
  if(known.filter(other=>other.name.trim().toLowerCase()===ex.name.trim().toLowerCase()).length<2) return '';
  // Separate same-name IDs remain selectable, including after category imports.
  const peers = known.filter(other=>other.name.trim().toLowerCase()===ex.name.trim().toLowerCase());
  return ` · ${ex.source} · history ${peers.findIndex(other=>other.id===ex.id)+1}`;
}
function renderExercisesLibrary(){
  const el = document.getElementById('view-exercises');
  const known = getKnownExercises();
  if(!known.length){
    el.innerHTML = `<div class="empty-state"><div class="ee">🏋️</div><div class="el">No exercises yet</div><div>Exercises from your workouts and history appear here.</div></div>`;
    return;
  }
  el.innerHTML = legacyHistoryNotice()+`<div class="exercise-library">${known.map(ex=>{
    const last = getLastSetForExercise(ex.id);
    const resume = state.activeSession?.kind==='exercise' && exerciseCatalogId(state.activeSession.exercises[0])===ex.id;
    return `<button type="button" class="tile exercise-library-card" data-catalog-id="${esc(ex.id)}">
      <div class="t-label">${esc(ex.name)}</div>
      <div class="t-sub">${last ? `${last.weight} kg × ${last.reps} reps` : 'No logged sets'}${esc(exerciseSourceLabel(ex, known))}</div>
      ${resume ? '<div class="t-sub">Resume · saved in progress</div>' : ''}
    </button>`;
  }).join('')}</div>`;
  el.querySelectorAll('[data-catalog-id]').forEach(button=>{
    button.onclick = ()=>startLibraryExercise(button.dataset.catalogId);
  });
}
function startLibraryExercise(id){
  const known = getKnownExercises().find(ex=>ex.id===id);
  if(!known) return;
  if(state.activeSession?.kind==='exercise' && exerciseCatalogId(state.activeSession.exercises[0])===id){
    navigate('session'); return;
  }
  if(state.activeSession && !confirm(`You have an unfinished session for "${state.activeSession.workoutName}". Discard it and start "${known.name}"?`)) return;
  const defaults = getRecentDefaultsForExercise(id);
  state.activeSession = {
    id:uid(), kind:'exercise', workoutId:'library:'+id, workoutName:known.name, date:new Date().toISOString(),
    exercises:[{exerciseId:uid(), catalogId:id, name:known.name, notes:'', ...defaults,
      startWeight:defaults.weight, startReps:defaults.reps, sets:[], finished:false}]
  };
  if(!saveState()) return;
  navigate('session');
}
function finishIndividualExercise(){
  const sess = state.activeSession;
  if(!sess || sess.kind!=='exercise') return;
  if(!sess.exercises[0].sets.length && !confirm('No sets logged yet. Finish exercise anyway?')) return;
  sess.exercises[0].finished = true;
  state.sessions.push(JSON.parse(JSON.stringify(sess)));
  state.activeSession = null;
  if(!saveState()){ renderSession(); return; }
  toast('Exercise saved');
  navigate('exercises', {}, false);
  history.replaceState({view:'exercises', params:{}}, '', '#exercises');
}

let selectedCatalogId = null;
function renderExerciseSuggestions(query, box, inputEl){
  selectedCatalogId = null;
  const q = query.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return; }
  const known = getKnownExercises();
  const matches = known.filter(ex=>ex.name.toLowerCase().includes(q)).slice(0,6);
  box.innerHTML = matches.map(ex=>`<button type="button" class="suggest-item" data-catalog-id="${esc(ex.id)}">${esc(ex.name)}${esc(exerciseSourceLabel(ex, known))}</button>`).join('');
  box.querySelectorAll('.suggest-item').forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      const ex = matches[i];
      inputEl.value = ex.name;
      selectedCatalogId = ex.id;
      box.innerHTML = '';
      const defaults = getRecentDefaultsForExercise(ex.id);
      document.getElementById('cw-exweight').value = defaults.weight;
      document.getElementById('cw-exreps').value = defaults.reps;
      inputEl.focus();
    });
  });
}

function renderCreate(workoutId){
  selectedCatalogId = null;
  if(workoutId){
    const w = state.workouts.find(x=>x.id===workoutId);
    if(w){
      editingWorkoutId = w.id;
      keepName = w.name;
      draftDeck = w.exercises.map(ex=>({...ex}));
      paintCreate();
      return;
    }
  }
  editingWorkoutId = null;
  keepName = '';
  draftDeck = [];
  paintCreate();
}
function paintCreate(){
  const el = document.getElementById('view-create');
  let deckHtml = draftDeck.map((ex,i)=>`
    <div class="deck-item">
      <div class="deck-move">
        <button type="button" class="deck-move-btn" data-move="up:${i}" aria-label="Move ${esc(ex.name)} up" ${i===0?'disabled':''}>▲</button>
        <span class="deck-num">${i+1}</span>
        <button type="button" class="deck-move-btn" data-move="down:${i}" aria-label="Move ${esc(ex.name)} down" ${i===draftDeck.length-1?'disabled':''}>▼</button>
      </div>
      <div class="deck-info">
        <div class="di-name">${esc(ex.name)}</div>
        <div class="di-sub">start ${ex.weight}kg × ${ex.reps}</div>
      </div>
      <button class="li-del" data-rm="${i}" aria-label="Remove ${esc(ex.name)}">✕</button>
    </div>`).join('');
  el.innerHTML = `
    <div class="field">
      <label for="cw-name">Workout name</label>
      <input type="text" id="cw-name" placeholder="e.g. Lower B">
    </div>
    <div class="eyebrow" style="margin-top:6px;">Deck (${draftDeck.length})</div>
    <div id="cw-deck" style="margin-bottom:14px;">${deckHtml || '<div class="muted" style="margin-bottom:10px;">No exercises added yet.</div>'}</div>

    <div class="inline-form">
      <div class="field">
        <label for="cw-exname">Exercise name</label>
        <input type="text" id="cw-exname" placeholder="e.g. Back Squat" autocomplete="off">
        <div id="cw-exname-suggest" class="suggest-list"></div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="cw-exweight">Start weight (kg)</label>
          <input type="text" inputmode="decimal" id="cw-exweight" value="20">
        </div>
        <div class="field">
          <label for="cw-exreps">Start reps</label>
          <input type="number" step="1" id="cw-exreps" value="8">
        </div>
      </div>
      <button class="btn ghost" id="cw-addex">+ Add Exercise Card</button>
    </div>

    <button class="btn primary" id="cw-save" style="margin-top:6px;">${editingWorkoutId ? 'Save Changes' : 'Save Workout'}</button>
  `;
  document.getElementById('cw-addex').onclick = ()=>{
    const name = document.getElementById('cw-exname').value.trim();
    const weight = readWeightInput(document.getElementById('cw-exweight'));
    const reps = readNonnegativeInput(document.getElementById('cw-exreps'), true);
    if(!name){ toast('Give the exercise a name'); return; }
    if(weight===null || reps===null){ toast('Enter a non-negative weight and whole rep count'); return; }
    const matches = [...getKnownExercises(), ...draftDeck.map(ex=>({id:exerciseCatalogId(ex), name:ex.name}))]
      .filter(ex=>ex.name.trim().toLowerCase()===name.toLowerCase());
    const ids = [...new Set(matches.map(ex=>ex.id))];
    if(!selectedCatalogId && ids.length>1){ toast('Choose an exercise suggestion to keep its history separate'); return; }
    const catalogId = selectedCatalogId || ids[0] || 'exercise:'+uid();
    draftDeck.push({id:uid(), catalogId, name, weight, reps});
    selectedCatalogId = null;
    paintCreate();
  };
  const exNameEl = document.getElementById('cw-exname');
  const suggestBox = document.getElementById('cw-exname-suggest');
  exNameEl.addEventListener('input', ()=> renderExerciseSuggestions(exNameEl.value, suggestBox, exNameEl));
  exNameEl.addEventListener('blur', ()=> setTimeout(()=>{ suggestBox.innerHTML=''; }, 150));
  el.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = ()=>{ draftDeck.splice(+btn.dataset.rm,1); paintCreate(); };
  });
  el.querySelectorAll('[data-move]').forEach(btn=>{
    btn.onclick = ()=>{
      const [dir, iStr] = btn.dataset.move.split(':');
      const i = parseInt(iStr, 10);
      const j = dir==='up' ? i-1 : i+1;
      if(j<0 || j>=draftDeck.length) return;
      [draftDeck[i], draftDeck[j]] = [draftDeck[j], draftDeck[i]];
      paintCreate();
    };
  });
  const nameEl = document.getElementById('cw-name');
  nameEl.value = keepName;
  nameEl.addEventListener('input', ()=>{ keepName = nameEl.value; });

  document.getElementById('cw-save').onclick = ()=>{
    const name = document.getElementById('cw-name').value.trim();
    if(!name){ toast('Name your workout first'); return; }
    if(draftDeck.length===0){ toast('Add at least one exercise'); return; }
    const exercises = draftDeck.map(x=>({...x, id:x.id||uid(), notes:x.notes || ''}));
    if(editingWorkoutId){
      const w = state.workouts.find(x=>x.id===editingWorkoutId);
      if(w){ w.name = name; w.exercises = exercises; }
    } else {
      state.workouts.push({ id: uid(), name, exercises });
    }
    if(!saveState()) return;
    toast(editingWorkoutId ? 'Workout updated' : 'Workout saved');
    editingWorkoutId = null; keepName = ''; draftDeck = [];
    navigate('workouts', {}, false);
    history.replaceState({view:'workouts',params:{}}, '', '#workouts');
  };
}

const DEFAULT_PARTS = ['Upper arm','Waist','Hip','Thigh','Forearm','Chest','Calf'];

function renderMeasure(){

  measureDraft = Object.create(null);
  measureDate = todayISODate();
  paintMeasure();
}
function paintMeasure(){
  const el = document.getElementById('view-measure');
  const val = (p)=> measureDraft[p]!=null ? measureDraft[p] : '';
  const fieldsHtml = DEFAULT_PARTS.map((p,i)=>`

      <input type="number" step="0.1" id="ms-custom-${i}" data-part="${esc(p)}" placeholder="—" value="${val(p)}">

      </div>
      <button class="btn ghost" id="ms-addcustom">+ Add Custom Measurement</button>
    </div>
    <button class="btn primary" id="ms-save">Save Measurements</button>
  `;
  document.getElementById('ms-date').addEventListener('input', (e)=>{ measureDate = e.target.value; });
  el.querySelectorAll('[data-part]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ measureDraft[inp.dataset.part] = inp.value; });
  });
  document.getElementById('ms-addcustom').onclick = ()=>{
    const n = document.getElementById('ms-customname').value.trim();
    if(!n){ toast('Name the measurement'); return; }

      if(value===null){ toast('Enter non-negative measurement values'); return; }
      incoming.push({id:uid(), date, part:inp.dataset.part, value});
    }
    const count = incoming.length;
    if(count===0){ toast('Enter at least one measurement'); return; }
    state.measurements.push(...incoming);

/* =========================================================
   PROGRESSION
   ========================================================= */
let progTab = 'workout';
let progCarousel = null;
let sizeCardIndex = 0;

function renderProgress(){
  sizeCardIndex = 0;
  paintProgress();
}
function paintProgress(){
  if(progCarousel){ progCarousel.destroy(); progCarousel = null; }
  const el = document.getElementById('view-progress');
  el.innerHTML = `
    <div class="seg">
      <button class="${progTab==='workout'?'active':''}" id="seg-workout">Workout</button>
      <button class="${progTab==='size'?'active':''}" id="seg-size">Size</button>
    </div>
    <div id="prog-body"></div>
  `;
  document.getElementById('seg-workout').onclick = ()=>{ progTab='workout'; paintProgress(); };
  document.getElementById('seg-size').onclick = ()=>{ progTab='size'; paintProgress(); };

  if(progTab==='workout') paintWorkoutProgress();
  else paintSizeProgress();
}

function est1RM(weight, reps){
  if(reps<=1) return weight;
  return weight * (1 + reps/30);
}

function paintWorkoutProgress(){
  const body = document.getElementById('prog-body');
  // Persistent identities share history across templates and individual logs.
  // The resolver retains the old name groups only for unidentified legacy data.
  const groups = Object.create(null);
  const sortedSessions = [...state.sessions].sort((a,b)=> new Date(a.date) - new Date(b.date));
  sortedSessions.forEach(sess=>{
    sess.exercises.forEach(ex=>{
      if(ex.sets.length===0 || !ex.name.trim()) return;
      const key = exerciseCatalogId(ex);
      if(!groups[key]) groups[key] = { name: ex.name, workoutName: sess.workoutName, points: [] };
      // Sessions are processed oldest-first, so re-assigning the label on every
      // match means it ends up reflecting the most recently logged name/workout,
      // rather than staying stuck on whatever the very first session called it.
      groups[key].name = ex.name;
      groups[key].workoutName = sess.workoutName;
      const best = ex.sets.reduce((m,s)=>{
        const e1 = est1RM(s.weight, s.reps);
        return e1>m.e ? {e:e1, w:s.weight, r:s.reps} : m;
      }, {e:-1, w:0, r:0});
      groups[key].points.push({ date: new Date(sess.date), value: Math.round(best.e*10)/10, w: best.w, r: best.r });
    });
  });
  const keys = Object.keys(groups);
  if(keys.length===0){
    body.innerHTML = `<div class="empty-state"><div class="ee">📈</div><div class="el">No logged sets yet</div><div>Finish a workout or individual exercise to see progress here.</div></div>`;
    return;
  }
  keys.forEach(k=> groups[k].points.sort((a,b)=>a.date-b.date));
  renderProgressCarousel(body, keys.map(k=>groups[k]), 'red', {unit:'kg', metricLabel:'Est. 1RM'});
  body.insertAdjacentHTML('afterbegin', legacyHistoryNotice());
}

function paintSizeProgress(){
  const body = document.getElementById('prog-body');
  const groups = Object.create(null);
  state.measurements.forEach(m=>{
    if(!groups[m.part]) groups[m.part] = { name: m.part, workoutName:null, points: [] };
    groups[m.part].points.push({ date: parseDate(m.date), value: m.value });
  });
  const keys = Object.keys(groups);
  if(keys.length===0){
    body.innerHTML = `<div class="empty-state"><div class="ee">📏</div><div class="el">No measurements yet</div><div>Add some from the home screen.</div></div>`;
    return;
  }
  keys.forEach(k=> groups[k].points.sort((a,b)=>a.date-b.date));
  const cards = keys.map(k=>groups[k]);
  sizeCardIndex = clampNum(sizeCardIndex, 0, cards.length-1);
  renderProgressCarousel(body, cards, 'green', {

function renderProgressCarousel(body, cards, colorName, opts={}){
  const color = colorName==='green' ? '#7A9B76' : '#E2472B';
  const unit = opts.unit || '';
  const metricLabel = opts.metricLabel || 'Latest';
  let slides = cards.map((c,i)=>{
    const pts = c.points;
    const last = pts[pts.length-1];
    const first = pts[0];
    const delta = pts.length>1 ? (last.value-first.value) : 0;
    const deltaStr = (delta>0?'+':'') + (Math.round(delta*10)/10) + unit;
    const bestSetLine = (last.w!=null) ? `<div class="muted" style="margin-top:10px; font-size:11px;">Best set that day: ${last.w}kg × ${last.r}</div>` : '';
    return `
    <div class="card-slide">
      <div class="chart-card">
        <div class="cc-title">${esc(c.name)}</div>
        <div class="cc-sub">${c.workoutName?esc(c.workoutName)+' · ':''}${pts.length} data point${pts.length!==1?'s':''}</div>
        <canvas class="chart" id="chart-${i}" data-idx="${i}"></canvas>
        <div class="stat-row">
          <div class="stat"><div class="sv mono">${last.value}${unit}</div><div class="sl">${metricLabel}</div></div>
          <div class="stat"><div class="sv mono">${deltaStr}</div><div class="sl">Change</div></div>
          <div class="stat"><div class="sv mono">${fmtDateShort(last.date)}</div><div class="sl">Last logged</div></div>
        </div>
        ${bestSetLine}
      </div>
    </div>`;
  }).join('');
  const startIndex = clampNum(opts.startIndex||0, 0, cards.length-1);
  body.innerHTML = `
    <div class="carousel-wrap">
      <div class="carousel-viewport" id="progViewport"><div class="carousel-track" id="progTrack">${slides}</div></div>
      <div class="dots" id="progDots"></div>
      <div class="carousel-nav">
        <button class="nav-arrow" id="progPrev" aria-label="Previous card">‹</button>
        <button class="nav-arrow" id="progNext" aria-label="Next card">›</button>
      </div>
    </div>
    ${opts.afterHtml || ''}
  `;
  buildDots('progDots', cards.length, startIndex);
  progCarousel = makeCarousel(
    document.getElementById('progViewport'), document.getElementById('progTrack'), cards.length,
    (i)=>{ buildDots('progDots', cards.length, i); if(opts.onChange) opts.onChange(i); },
    startIndex
  );
  if(opts.onChange) opts.onChange(startIndex);
  document.getElementById('progPrev').onclick = ()=>progCarousel.prev();
  document.getElementById('progNext').onclick = ()=>progCarousel.next();

  // draw charts after layout settles
  requestAnimationFrame(()=>{
    cards.forEach((c,i)=>{
      const canvas = document.getElementById('chart-'+i);
      if(canvas) drawChart(canvas, c.points, color);
    });
  });
}

/* =========================================================
   CANVAS LINE CHART
   ========================================================= */
function drawChart(canvas, points, color){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  if(!points || points.length===0) return;
  const pad = {l:40, r:10, t:14, b:22};
  const xs = points.map(p=>p.date.getTime());
  const ys = points.map(p=>p.value);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const yPad = (maxY-minY)*0.18; minY -= yPad; maxY += yPad;

  const xScale = x => pad.l + (maxX===minX ? (w-pad.l-pad.r)/2 : ((x-minX)/(maxX-minX))*(w-pad.l-pad.r));
  const yScale = y => (h-pad.b) - ((y-minY)/(maxY-minY))*(h-pad.t-pad.b);

  ctx.strokeStyle = '#2c2f34'; ctx.lineWidth = 1;
  [minY, (minY+maxY)/2, maxY].forEach(v=>{
    const y = yScale(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#8b8f97'; ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(Math.round(v*10)/10, pad.l-6, y);
  });

  if(points.length>1){
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    points.forEach((p,i)=>{
      const x = xScale(p.date.getTime()), y = yScale(p.value);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  ctx.fillStyle = color;
  points.forEach(p=>{
    const x = xScale(p.date.getTime()), y = yScale(p.value);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
  });

  ctx.fillStyle = '#8b8f97'; ctx.font = '10.5px -apple-system, sans-serif'; ctx.textBaseline='top';
  ctx.textAlign='left';
  ctx.fillText(fmtDateShort(points[0].date.toISOString()), pad.l, h-pad.b+6);
  ctx.textAlign='right';
  ctx.fillText(fmtDateShort(points[points.length-1].date.toISOString()), w-pad.r, h-pad.b+6);
}

function downloadJSON(filename, obj){
  downloadJSONText(filename, JSON.stringify(obj, null, 2));
}
function downloadJSONText(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function readJSONFile(file){
  return JSON.parse(await file.text());
}
