/* Validate before replacing anything. Preserve v1 IDs, active-session fields and
   unknown metadata so round-tripping an existing backup does not lose data. */
function requireRecord(value){
  if(!value || typeof value!=='object' || Array.isArray(value)) throw new Error('Expected a record');
  return value;
}
function recordArray(value=[]){
  if(!Array.isArray(value)) throw new Error('Expected an array');
  return value;
}
function textValue(value, fallback=''){
  if(value===undefined || value===null) return fallback;
  if(typeof value!=='string') throw new Error('Expected text');
  return value || fallback;
}
function idValue(value){
  if(value===undefined || value===null || value==='') return uid();
  if(typeof value!=='string' && !(typeof value==='number' && Number.isFinite(value))) throw new Error('Invalid ID');
  return String(value);
}
function numericValue(value, fallback=0){
  if(value===undefined || value===null || value==='') return fallback;
  if(typeof value!=='number' && typeof value!=='string') throw new Error('Invalid number');
  const number = Number(value);
  if(!Number.isFinite(number)) throw new Error('Invalid number');
  return number;
}
function dateValue(value, fallback){
  const date = value===undefined || value===null || value==='' ? fallback : value;
  if(typeof date!=='string' || !Number.isFinite(Date.parse(date))) throw new Error('Invalid date');
  // Date.parse normalizes impossible calendar dates (e.g. February 30).
  const calendar = /^(\d{4})-(\d{2})-(\d{2})(?:$|T)/.exec(date);
  if(calendar){
    const day = new Date(`${calendar[1]}-${calendar[2]}-${calendar[3]}T00:00:00Z`);
    if(!Number.isFinite(day.getTime()) || day.toISOString().slice(0,10)!==calendar[0].slice(0,10)) throw new Error('Invalid calendar date');
  }
  return date;
}
function exerciseIdentityFields(ex){
  const fields = {};
  if(ex.catalogId!==undefined){
    if(typeof ex.catalogId!=='string' || !ex.catalogId.trim()) throw new Error('Invalid exercise identity');
    fields.catalogId = ex.catalogId;
  }
  if(ex.draftInputs!==undefined){
    const draft = requireRecord(ex.draftInputs);
    for(const role of ['weight','reps']){
      if(draft[role]!==undefined && typeof draft[role]!=='string') throw new Error('Invalid input draft');
    }
    fields.draftInputs = {...draft};
  }
  return fields;
}
function normalizeWorkouts(arr){
  return recordArray(arr).map(record=>{
    const w = requireRecord(record);
    return {
      ...w, id:idValue(w.id), name:textValue(w.name,'Untitled'),
      exercises:recordArray(w.exercises).map(record=>{
        const ex = requireRecord(record);
        return {...ex, ...exerciseIdentityFields(ex), id:idValue(ex.id), name:textValue(ex.name,'Exercise'),
          weight:numericValue(ex.weight), reps:Math.round(numericValue(ex.reps)), notes:textValue(ex.notes)};
      })
    };
  });
}
function normalizeSessions(arr){
  return recordArray(arr).map(record=>{
    const s = requireRecord(record);
    if(s.kind==='exercise'){
      if(!Array.isArray(s.exercises) || s.exercises.length!==1) throw new Error('Invalid individual exercise session');
      if(s.editSetDraft!==undefined){
        const draft = requireRecord(s.editSetDraft);
        if(draft.exerciseIndex!==0 || !Number.isInteger(draft.setIndex) || draft.setIndex<0 ||
          !Array.isArray(s.exercises[0]?.sets) || !s.exercises[0].sets[draft.setIndex] ||
          typeof draft.weight!=='string' || typeof draft.reps!=='string') throw new Error('Invalid set edit draft');
      }
    }
    return {
      ...s, id:idValue(s.id), workoutId:idValue(s.workoutId),
      workoutName:textValue(s.workoutName,'Workout'), date:dateValue(s.date,new Date().toISOString()),
      exercises:recordArray(s.exercises).map(record=>{
        const ex = requireRecord(record);
        const sets = recordArray(ex.sets).map(record=>{
          const set = requireRecord(record);
          return {...set, weight:numericValue(set.weight), reps:Math.round(numericValue(set.reps)), time:dateValue(set.time,dateValue(s.date,new Date().toISOString()))};
        });
        const last = sets[sets.length-1];
        const weight = numericValue(ex.weight, last ? last.weight : numericValue(ex.startWeight));
        const reps = Math.round(numericValue(ex.reps, last ? last.reps : numericValue(ex.startReps)));
        return {...ex, ...exerciseIdentityFields(ex), exerciseId:idValue(ex.exerciseId), name:textValue(ex.name,'Exercise'),
          notes:textValue(ex.notes), finished:!!ex.finished, sets, weight, reps,
          startWeight:numericValue(ex.startWeight,weight), startReps:Math.round(numericValue(ex.startReps,reps))};
      })
    };
  });
}
function normalizeMeasurements(arr){
  return recordArray(arr).map(record=>{
    const m = requireRecord(record);
    return {...m, id:idValue(m.id), date:dateValue(m.date,todayISODate()), part:textValue(m.part,'Measurement'), value:numericValue(m.value)};
  });
}
function normalizeState(value){
  const parsed = requireRecord(value);
  if(parsed.version!==undefined && parsed.version!==1) throw new Error('Unsupported backup version');
  if(!Array.isArray(parsed.workouts) || !Array.isArray(parsed.sessions) || !Array.isArray(parsed.measurements)) throw new Error('Incomplete full backup');
  return {...parsed, version:1, workouts:normalizeWorkouts(parsed.workouts), sessions:normalizeSessions(parsed.sessions),
    measurements:normalizeMeasurements(parsed.measurements),
    activeSession:parsed.activeSession==null ? null : normalizeSessions([requireRecord(parsed.activeSession)])[0]};
}

/* Category imports replace only their own collection, after full validation. */
async function importCategory(e, category, normalize, confirmMessage, successMessage, errorMessage){
  const file = e.target.files[0]; if(!file) return;
  try{
    const parsed = requireRecord(await readJSONFile(file));
    if(parsed.version!==undefined && parsed.version!==1) throw new Error('Unsupported backup version');
    if(!Array.isArray(parsed[category])) throw new Error('Missing category');
    const incoming = normalize(parsed[category]);
    if(!confirm(confirmMessage(state[category].length,incoming.length))) return;
    state = {...state, [category]:incoming};
    if(!saveState()) return;
    toast(successMessage);
    renderBackup();
  }catch(err){
    alert(errorMessage);
  }finally{
    e.target.value = '';
  }
}
function importWorkoutsFile(e){
  return importCategory(e,'workouts',normalizeWorkouts,
    (current,incoming)=>`Replace your current ${current} workouts with the ${incoming} workouts in this file? Session history and measurements are not affected.`,
    'Workouts imported',"That file doesn't look like a valid Racked workouts export.");
}
function importSessionsFile(e){
  return importCategory(e,'sessions',normalizeSessions,
    (current,incoming)=>`Replace your current ${current} logged sessions with the ${incoming} sessions in this file? Workouts and measurements are not affected.`,
    'Workout progression imported',"That file doesn't look like a valid Racked workout progression export.");
}
function importMeasurementsFile(e){
  return importCategory(e,'measurements',normalizeMeasurements,
    (current,incoming)=>`Replace your current ${current} measurements with the ${incoming} measurements in this file? Workouts and session history are not affected.`,
    'Measurements imported',"That file doesn't look like a valid Racked measurements export.");
}
async function importFullBackup(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const next = normalizeState(await readJSONFile(file));
    if(!confirm('Replace ALL current data (workouts, sessions, measurements) with this backup?')) return;
    state = next;
    if(!saveState({allowRecovery:true})) return;
    toast('Full backup restored');
    navigate('home', {}, false);
    history.replaceState({view:'home',params:{}}, '', '#home');
  }catch(err){
    alert('That file could not be read as a valid Racked full backup.');
  }finally{
    e.target.value = '';
  }
}

function copySummary(){
  let lines = [];
  lines.push(`Racked progress summary — ${fmtDateFull(new Date().toISOString())}`);
  lines.push('');
  lines.push('## Workouts');
  state.workouts.forEach(w=>{
    lines.push(`- ${w.name}: ${w.exercises.map(e=>e.name).join(', ')}`);
  });
  lines.push('');
  lines.push('## Recent sessions (top set per exercise)');
  const recent = state.sessions.slice(-15);
  recent.forEach(s=>{
    lines.push(`${fmtDateShort(s.date)} — ${s.workoutName}`);
    s.exercises.forEach(ex=>{
      if(ex.sets.length===0) return;
      const top = ex.sets.reduce((m,x)=> x.weight>m.weight?x:m, ex.sets[0]);
      lines.push(`  ${ex.name}: top set ${top.weight}×${top.reps} (${ex.sets.length} sets)${ex.notes?' — '+ex.notes:''}`);
    });
  });
  lines.push('');
  lines.push('## Measurements');
  const byPart = Object.create(null);
  state.measurements.forEach(m=>{ (byPart[m.part]=byPart[m.part]||[]).push(m); });
  Object.keys(byPart).forEach(part=>{
    const arr = byPart[part].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const last = arr[arr.length-1];
    lines.push(`- ${part}: latest ${last.value}cm on ${fmtDateShort(last.date)} (${arr.length} entries)`);
  });
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Summary copied — paste it to an LLM')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{
    if(document.execCommand('copy')) toast('Summary copied');
    else alert(text);
  }catch(e){ alert(text); }
  document.body.removeChild(ta);
}

/* =========================================================
   CROSS-TAB EDIT ACCESS
   ========================================================= */
let releaseWriteLock = null;
let lockAbort = null;
let pageActive = true;
let lockingUnavailable = false;
let everHadWriteAccess = false;

function updateStorageAccess(){
  const editable = hasWriteLock && !storageConflict;
  document.getElementById('app').inert = !editable || document.getElementById('modalOverlay').classList.contains('show');
  document.getElementById('modalOverlay').inert = !editable;
  document.getElementById('storageNotice').hidden = editable;
  document.getElementById('storageMessage').textContent = storageConflict
    ? 'Saved data changed outside this editor. Saving is paused to protect it. Export this tab’s data and form drafts before reloading. Saved data from the other tab will be kept.'
    : lockingUnavailable
      ? 'Safe editing is unavailable in this browser. Use a current browser over HTTPS or localhost. Your saved data can still be exported.'
      : 'Another Racked tab may be editing. Close it to continue here. This tab will load the latest saved data before editing; you can export this tab’s snapshot while waiting.';
}
function stopStaleEditor(){
  const snapshot = {...state};
  const draft = {view:currentView, fields:[...document.querySelectorAll('.view.active input:not([type="file"]), .view.active textarea, #modalCard input, #modalCard textarea')]
    .map(el=>({id:el.id, role:el.dataset.role, index:el.dataset.idx, part:el.dataset.part, value:el.value}))};
  if(currentView==='create'){ draft.workoutName = keepName; draft.exercises = draftDeck; }
  if(currentView==='measure'){ draft.date = measureDate; draft.measurements = measureDraft; draft.customParts = customParts; }
  // Keep a normal v1 full backup and attach otherwise unsaved form values for
  // manual recovery. Never replace pre-existing imported metadata with ours.
  let draftKey = 'rackedRecoveryDraft';
  while(Object.prototype.hasOwnProperty.call(snapshot, draftKey)) draftKey += '_';
  snapshot[draftKey] = draft;
  conflictStateJSON = JSON.stringify(snapshot);
  state = JSON.parse(persistedStateJSON);
  storageConflict = true;
  hasWriteLock = false;
  if(releaseWriteLock) releaseWriteLock();
  updateStorageAccess();
}
function requestWriteAccess(){
  if(lockAbort || storageConflict || lockingUnavailable || !pageActive) return;
  if(!navigator.locks || !navigator.locks.request){
    lockingUnavailable = true;
    updateStorageAccess();
    return;
  }
  lockAbort = new AbortController();
  // A document-lifetime lock keeps existing synchronous mutations atomic without
  // leases, polling, or changing the v1 localStorage record. Closing/navigation
  // releases ownership; a waiting tab reloads storage before its UI is enabled.
  navigator.locks.request(STORAGE_KEY, {mode:'exclusive', signal:lockAbort.signal}, async ()=>{
    if(!pageActive) return;
    let changed = false;
    try { changed = localStorage.getItem(STORAGE_KEY)!==observedStorageRaw; }
    catch (_) { if(!storageReadFailed) state = loadState(); }
    if(changed && everHadWriteAccess){
      stopStaleEditor();
      return;
    }
    if(changed) state = loadState();
    if(!everHadWriteAccess){
      currentView = 'home'; currentParams = {};
      history.replaceState({view:'home',params:{}}, '', '#home');
      render();
    }
    // Same-snapshot BFCache restores keep form drafts, focus and open editors.
    hasWriteLock = true;
    everHadWriteAccess = true;
    updateStorageAccess();
    await new Promise(resolve=>{ releaseWriteLock = resolve; });
    releaseWriteLock = null;
    hasWriteLock = false;
  }).catch(error=>{
    if(error.name!=='AbortError') lockingUnavailable = true;
  }).finally(()=>{
    lockAbort = null;
    updateStorageAccess();
    // A BFCache restore can precede completion of the old request's release.
    requestWriteAccess();
  });
}
window.addEventListener('pagehide', ()=>{
  pageActive = false;
  hasWriteLock = false;
  if(lockAbort) lockAbort.abort();
  if(releaseWriteLock) releaseWriteLock();
  updateStorageAccess();
});
window.addEventListener('pageshow', ()=>{
  pageActive = true;
  requestWriteAccess();
});
window.addEventListener('storage', event=>{
  if(hasWriteLock && (event.key===STORAGE_KEY || event.key===null)){
    // Compare the current bytes, not possibly delayed event.newValue.
    try { if(event.storageArea===localStorage && localStorage.getItem(STORAGE_KEY)!==observedStorageRaw) stopStaleEditor(); }
    catch (_) { stopStaleEditor(); }
  }
});
document.getElementById('storageExport').onclick = ()=>{
  if(conflictStateJSON!==null){
    downloadJSONText(`racked-conflict-${todayISODate()}.json`, conflictStateJSON);
    toast('This tab’s data exported');
  } else exportFullBackup();
};
document.getElementById('storageReload').onclick = ()=>{
  if(confirm('Reload the latest saved data? Unsaved form fields will be discarded. Export this tab’s data first if you need a copy.')) location.reload();
};

/* =========================================================
   INIT
   ========================================================= */
history.replaceState({view:'home', params:{}}, '', '#home');
render();
updateStorageAccess();
requestWriteAccess();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* ok if unavailable, e.g. file:// */ });
  });
}
})();
</script>
